name: backupdesk

services:
  desk:
    build: .
    image: backupdesk:local
    container_name: backupdesk
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      LEDGER_DB: /data/ledger/ops_ledger.sqlite3
      BACKUP_DIR: /data/backups
      STATE_DB: /data/state/backupdesk.sqlite3
      LOCAL_TZ: America/New_York
      # Set a token to require X-Drill-Token on /drill/* in shared environments.
      DRILL_TOKEN: ${DRILL_TOKEN:-}
      SEED_SAMPLE_LEDGER: "1"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SCHEDULER_POLL_SECONDS: "1"
    ports:
      - "${DESK_PORT:-8080}:8080"
    volumes:
      - deskdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  # Continuous sample-ledger writer.  It only starts after the desk has created
  # the seed ledger, so the copy never races an empty database.
  ledger-writer:
    build: .
    image: backupdesk:local
    container_name: backupdesk-writer
    restart: unless-stopped
    depends_on:
      desk:
        condition: service_healthy
    environment:
      LEDGER_DB: /data/ledger/ops_ledger.sqlite3
    volumes:
      - deskdata:/data
    entrypoint: ["python", "-m", "backupdesk.ledger"]
    command: ["write", "--db", "/data/ledger/ops_ledger.sqlite3", "--interval", "0.5", "--batch", "3"]

volumes:
  deskdata:
