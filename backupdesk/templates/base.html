<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}值班台账备份台{% endblock %}</title>
  <style>
    :root {
      --ink: #16202b; --muted: #5d6b7a; --line: #dfe5ec; --bg: #f5f7fa;
      --card: #ffffff; --accent: #1f5f8b; --ok: #157f4f; --warn: #a86100;
      --bad: #b3261e; --chip: #eef3f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 28px; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
    header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    main { padding: 22px 28px 60px; max-width: 1240px; margin: 0 auto; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
    .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); letter-spacing: .3px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    code, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    .muted { color: var(--muted); }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip);
      font-size: 12px; color: var(--muted); }
    .chip.ok { background: #e6f4ec; color: var(--ok); }
    .chip.warn { background: #fdf1dd; color: var(--warn); }
    .chip.bad { background: #fbe9e7; color: var(--bad); }
    .status-completed { color: var(--ok); font-weight: 600; }
    .status-running { color: var(--accent); font-weight: 600; }
    .status-pending { color: var(--warn); font-weight: 600; }
    .status-failed, .status-expired { color: var(--bad); font-weight: 600; }
    form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0; }
    input[type=text] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit;
      font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-width: 250px; }
    button { padding: 7px 13px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
      border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent); }
    button.link { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; }
    a { color: var(--accent); }
    .errors { background: #fbe9e7; color: var(--bad); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; }
    .actions button { margin-right: 6px; margin-bottom: 6px; }
    .event { font-size: 12.5px; }
  </style>
</head>
<body>
<header>
  <h1>值班台账备份台</h1>
  <div class="sub">每日 01:30–03:00（America/New_York）生成一致快照 · 单实例 · 可演练</div>
</header>
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
